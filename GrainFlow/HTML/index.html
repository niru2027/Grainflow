<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GrainFlow | Login</title>

    <link rel="stylesheet" href="../CSS/style.css" />
  </head>

  <body>
    <div class="login-container">
      <!-- Left Side -->
      <div class="login-image">
        <div class="overlay">
          <h1>GrainFlow</h1>
          <p>Smart Rice Mill Management System</p>
        </div>
      </div>

      <!-- Right Side -->
      <div class="login-box">
        <div class="logo">🌾</div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Login to your GrainFlow account</p>

        <form>
          <label>Email Address</label>
          <input type="email" placeholder="Enter your email" required />

          <label>Password</label>
          <input type="password" placeholder="Enter your password" required />

          <div class="options">
            <label class="remember">
              <input type="checkbox" />
              Remember me
            </label>

            <a href="#">Forgot Password?</a>
          </div>

          <button type="submit">Login</button>
        </form>

        <p class="footer-text">GrainFlow © 2026</p>
      </div>
    </div>
  </body>
</html>
